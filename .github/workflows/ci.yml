# Continuous integration for the cms6-compat line of Advanced Taxonomies
# (Silverstripe CMS 6.2 on PHP 8.3; CMS 6.3 on PHP 8.4 and 8.5).
#
# Two jobs run in parallel, each over a matrix: a PHP syntax lint of src and
# tests on every PHP version, and the module's PHPUnit suite on every CMS and
# PHP pair. The suite runs the way a site loads the module: a throwaway
# project (silverstripe/recipe-cms at the pair's version) installs it from
# this checkout as a path repository, runs PHPUnit 11 over the installed copy
# of tests/ against a MySQL 8.0 service, then builds the database.
#
# Jobs run on ubuntu-24.04 rather than ubuntu-latest, so the image cannot move
# under the PHP version. GitHub's own actions follow their major version; the
# one third-party action is pinned to a commit, with its release in the
# trailing comment.
name: CI

on:
  pull_request:
  push:
    branches:
      - cms6-compat
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request; a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PHP syntax over the module's own code. Nothing else is installed.
  lint:
    name: lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Installed globally, so the job needs no project. Its bin directory goes
      # on PATH explicitly, wherever Composer chose to put its home.
      - name: Install parallel-lint
        run: |
          composer global require --no-interaction --no-progress 'php-parallel-lint/php-parallel-lint:^1.4'
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"

      - name: Lint PHP syntax
        run: parallel-lint --colors src tests

  # The PHPUnit suite inside a CMS project, one per matrix pair. The job
  # connects to MySQL as root; SapphireTest creates and drops its own
  # temporary databases. Any failure or error fails the job.
  #
  # CMS 6.2 keeps its PHP 8.3 pair, pinned to ~6.2.0 so the leg stays on 6.2
  # now that 6.3 is stable. The CMS 6.3 pairs install ~6.3.0 at stable
  # stability (6.3.0 was tagged on 28 October 2026; until then the matrix
  # allowed its release candidates).
  phpunit:
    name: phpunit (CMS ${{ matrix.cms }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cms: '6.2'
            recipe: '~6.2.0'
            stability: stable
            php: '8.3'
          - cms: '6.3'
            recipe: '~6.3.0'
            stability: stable
            php: '8.4'
          - cms: '6.3'
            recipe: '~6.3.0'
            stability: stable
            php: '8.5'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: module
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, gd, mysqli, pdo_mysql
          tools: composer
          coverage: none
        env:
          fail-fast: true

      # The project requires the module at any dev version, so the checkout's
      # branch or detached merge ref does not matter; everything else installs
      # at the newest version the pair's stability allows, stable first. The
      # path repository symlinks the checkout into vendor/: a copy would be
      # made through the module's .gitattributes, whose export-ignore rules
      # leave tests/ out.
      - name: Create the CMS ${{ matrix.cms }} project
        run: |
          mkdir project
          cat > project/composer.json <<'EOF'
          {
            "name": "chrometoaster/advanced-taxonomies-ci",
            "type": "project",
            "repositories": [
              {
                "type": "path",
                "url": "../module",
                "options": {
                  "symlink": true
                }
              }
            ],
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "chrometoaster/silverstripe-advanced-taxonomies": "*@dev"
            },
            "require-dev": {
              "phpunit/phpunit": "^11.3"
            },
            "minimum-stability": "${{ matrix.stability }}",
            "prefer-stable": true,
            "config": {
              "allow-plugins": {
                "composer/installers": true,
                "silverstripe/recipe-plugin": true,
                "silverstripe/vendor-plugin": true
              }
            }
          }
          EOF
          cat > project/phpunit.xml <<'EOF'
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true">
            <testsuites>
              <testsuite name="advanced-taxonomies">
                <directory>vendor/chrometoaster/silverstripe-advanced-taxonomies/tests</directory>
              </testsuite>
            </testsuites>
          </phpunit>
          EOF
          # Throwaway values for this job's MySQL service, not secrets.
          cat > project/.env <<'EOF'
          SS_ENVIRONMENT_TYPE=dev
          SS_DATABASE_CLASS=MySQLDatabase
          SS_DATABASE_SERVER=127.0.0.1
          SS_DATABASE_USERNAME=root
          SS_DATABASE_PASSWORD=root
          SS_DATABASE_NAME=at_ci
          SS_ERROR_LOG=silverstripe.log
          EOF

      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # No lock file to hash: the key moves with the module's composer.json,
      # and a restore from an older key only seeds the download cache.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-cms${{ matrix.cms }}-php${{ matrix.php }}-${{ hashFiles('module/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-cms${{ matrix.cms }}-php${{ matrix.php }}-

      - name: Install Composer dependencies
        working-directory: project
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Show the installed module and recipe
        working-directory: project
        run: |
          for package in silverstripe/recipe-cms silverstripe/framework chrometoaster/silverstripe-advanced-taxonomies; do
            composer show "$package" | grep -E '^(name|versions|source|dist)'
          done

      # PHPUnit runs before db:build: a flushed db:build caches a class
      # manifest without the test classes, which PHPUnit would then reuse, so
      # the suite's TestOnly owner object would lose its configuration.
      - name: PHPUnit
        working-directory: project
        run: vendor/bin/phpunit

      # The module's tables and config build against an empty database. Runs
      # even when PHPUnit fails, so one run reports both.
      - name: Build the database
        if: ${{ !cancelled() }}
        working-directory: project
        run: vendor/bin/sake db:build --flush

      - name: Show the log
        if: ${{ failure() || cancelled() }}
        working-directory: project
        run: |
          if [ -f silverstripe.log ]; then
            cat silverstripe.log
          fi
